name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

        # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
        # or https://code.claude.com/docs/en/cli-reference for available options
      - name: Run Claude Code Review Plugin
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

      - name: Run Claude Prompt-based Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          track_progress: true # ✨ Enables tracking comments
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review with the following focus areas:

            1. **Functionality**
               - Verify the code changes implement the changes described in the PR
               - Identify any potential bugs or issues
               - Identify potential breaking changes

            2. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability (e.g.
                 no commented-out code, meaningful variable names)

            3. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic
               - No hardcoded credentials
               - No sensitive data in logs

            4. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues

            5. **Testing**
               - Unit tests for new functions
               - Integration tests for new endpoints
               - Verify adequate test coverage (> 80%)
               - Review test quality and edge cases
               - Check for missing test scenarios

            6. **Documentation**
               - Ensure code is properly documented
               - Inline comments for complex logic
               - Verify README updates for new features
               - Check API documentation accuracy

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations.

            On each comment that is added, include a note that the comment came
            from the "Claude Prompt-based Code Review GitHub Action".

          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model claude-opus-4.8
