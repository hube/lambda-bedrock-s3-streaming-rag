name: Test - document vectorization Lambda

on:
  pull_request:
    paths:
      - "packages/data-pipeline/**"
      - ".github/workflows/test-document-vectorization-lambda.yml"
      - "yarn.lock"
      - "package.json"
      - ".yarnrc.yml"
  push:
    branches:
      - main
    paths:
      - "packages/data-pipeline/**"
      - ".github/workflows/test-document-vectorization-lambda.yml"
      - "yarn.lock"
      - "package.json"
      - ".yarnrc.yml"

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-24.04-arm
    permissions:
      code-quality: write

    steps:
      - uses: actions/checkout@v6

      # Corepack must be enabled before setup-node resolves the yarn cache,
      # otherwise `cache: yarn` invokes the wrong (classic) yarn.
      - run: corepack enable

      - name: Node 22 + yarn cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      # Install at the workspace root against the single root lockfile; running
      # install inside packages/data-pipeline would not match the monorepo.
      - name: Install dependencies
        run: yarn install --immutable

      # Run via yarn from the package so the PnP loader is active.
      - name: Run unit tests + coverage
        working-directory: packages/data-pipeline
        run: yarn test:coverage

      - name: Upload coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: packages/data-pipeline/coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage
          fail-on-error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/data-pipeline/coverage/

      - name: Coverage summary
        working-directory: packages/data-pipeline
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const pct = (v) => v.pct.toFixed(1) + '%';
              console.log('| Category    | Coverage |');
              console.log('|-------------|----------|');
              console.log('| Lines       | ' + pct(s.lines) + ' |');
              console.log('| Statements  | ' + pct(s.statements) + ' |');
              console.log('| Functions   | ' + pct(s.functions) + ' |');
              console.log('| Branches    | ' + pct(s.branches) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "_coverage-summary.json not found_" >> $GITHUB_STEP_SUMMARY
          fi

  integration:
    name: Integration tests (LocalStack)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - run: corepack enable

      - name: Node 22 + yarn cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Pre-pull LocalStack image
        run: docker pull localstack/localstack:3

      - name: Run integration tests
        working-directory: packages/data-pipeline
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: unix:///var/run/docker.sock
        run: yarn test:integration
